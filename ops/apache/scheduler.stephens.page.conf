<VirtualHost *:80>
    ServerName scheduler.stephens.page
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Require all granted
    </Directory>
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName scheduler.stephens.page

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/scheduler.stephens.page/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/scheduler.stephens.page/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3531/ connectiontimeout=5 timeout=30
    ProxyPassReverse / http://127.0.0.1:3531/
    RequestHeader set X-Forwarded-Proto "https"

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
</IfModule>
